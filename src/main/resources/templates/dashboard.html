<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        h1 { color: #0F2443; margin: 0; }
        .logout-form { margin: 0; }
        .logout-form button { background: #94A3B8; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .status-BOOKED    { color: #F59E0B; font-weight: bold; }
        .status-COMPLETED { color: #10B981; font-weight: bold; }
        .status-CANCELLED { color: #94A3B8; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>歡迎，<span th:text="${doctor.name}"></span>（<span th:text="${doctor.department}"></span>）</p>
        </div>
        <form class="logout-form" th:action="@{/logout}" method="post">
            <button type="submit">登出</button>
        </form>
    </header>

    <h2 th:text="|今日掛號：${today}|"></h2>

    <p th:if="${appointments.isEmpty()}">今日沒有掛號。</p>

    <table th:unless="${appointments.isEmpty()}">
        <thead>
            <tr>
                <th>時段</th>
                <th>病患</th>
                <th>病歷號</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.timeSlot}">AM</td>
                <td th:text="${appt.patient.name}">測試病患甲</td>
                <td th:text="${appt.patient.chartNo}">TEST00001</td>
                <td>
                    <span th:text="${appt.status}" th:class="${'status-' + appt.status}">BOOKED</span>
                    <!-- 僅顯示 BOOKED 狀態才有的看診完成按鈕 -->
                    <button th:if="${appt.status == 'BOOKED'}"
                            th:data-id="${appt.apptId}"
                            onclick="completeAppointment(this)"
                            style="margin-left: 10px; font-size: 12px; padding: 2px 8px; cursor: pointer;">看診完成</button>
                    <!-- 僅顯示 BOOKED 狀態才有的取消按鈕 -->
                    <button th:if="${appt.status == 'BOOKED'}"
                            th:data-id="${appt.apptId}"
                            onclick="cancelAppointment(this)"
                            style="margin-left: 5px; font-size: 12px; padding: 2px 8px; cursor: pointer;">取消</button>
                </td>
            </tr>
        </tbody>
    </table>
        <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/}">← 回首頁</a>
    </p>

    <script>
        // 通用的掛號狀態更新函數
        function sendAppointmentStatusUpdate(btn, status) {
            const apptId = btn.getAttribute('data-id');
            let confirmMessage = '';
            let successMessage = '';
            let errorMessage = '';

            if (status === 'COMPLETED') {
                confirmMessage = '確定要將此掛號標記為「看診完成」嗎？';
                successMessage = '掛號已標記為完成！';
                errorMessage = '標記完成失敗，請稍後再試。';
            } else if (status === 'CANCELLED') {
                confirmMessage = '確定要取消這筆掛號嗎？';
                successMessage = '已成功取消！';
                errorMessage = '取消失敗，請稍後再試。';
            } else {
                return; // 無效的狀態
            }

            if (!confirm(confirmMessage)) return;

            fetch(`/api/appointments/${apptId}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: status })
            })
            .then(response => {
                if (response.ok) {
                    alert(successMessage);
                    location.reload(); // 重新整理頁面
                } else if (response.status === 403) {
                    alert('錯誤：您沒有權限修改此掛號狀態');
                } else {
                    alert(errorMessage);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('網路傳輸發生錯誤');
            });
        }

        // 「看診完成」按鈕的點擊事件
        function completeAppointment(btn) {
            sendAppointmentStatusUpdate(btn, 'COMPLETED');
        }

        // 「取消」按鈕的點擊事件 (如果之前沒有，這裡也一併提供)
        function cancelAppointment(btn) {
            sendAppointmentStatusUpdate(btn, 'CANCELLED');
        }
    </script>
</body>
</html>
